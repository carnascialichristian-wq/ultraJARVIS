[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrajarvis"
version = "0.8.0"
description = "UltraJarvis agent runtime"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
uj = "uj_cli:main"

[tool.setuptools]
py-modules = ["uj_cli", "cloud_bridge"]

[tool.setuptools.packages.find]
include = ["core*", "advisors*", "tools*"]
